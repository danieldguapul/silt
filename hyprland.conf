$activeBorderColor = rgb(5a9db3)
$inactiveBorderColor = rgba(3b3b32ff)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in = 5
    gaps_out = 8
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 12
    active_opacity = 0.96
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.1
        contrast = 1.2
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.3
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        offset = 3 3
        color = rgba(1a1812ee)
    }
}

animations {
    enabled = yes
    bezier = settle, 0.15, 0.85, 0.25, 1.00
    bezier = current, 0.30, 0.90, 0.10, 1.00
    bezier = drift, 0.22, 0.88, 0.12, 1.00
    bezier = ripple, 0.12, 0.72, 0.08, 1.00
    bezier = ebb, 0.35, 0.95, 0.05, 1.00

    animation = windows, 1, 6, current
    animation = windowsIn, 1, 8, current, popin 6%
    animation = windowsOut, 1, 6, ebb, popin 80%
    animation = windowsMove, 1, 7, drift
    animation = workspaces, 1, 5, settle, slidevert
    animation = border, 1, 8, ripple
    animation = fade, 1, 6, drift
    animation = layers, 1, 7, drift, slide
    animation = layersIn, 1, 7, drift, slide
    animation = layersOut, 1, 7, ebb, slide
}

layerrule = no_anim on, match:namespace walker
